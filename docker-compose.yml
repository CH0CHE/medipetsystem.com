services:
  postgres:
    image: postgres:16-alpine
    container_name: medipet_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medipet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medipet_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-medipetsystem}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - medipet_postgres_data:/var/lib/postgresql/data
      - ./docker/init-shadow-db.sql:/docker-entrypoint-initdb.d/init-shadow-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medipet} -d ${POSTGRES_DB:-medipetsystem}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4.8.1
    container_name: medipet_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  medipet_postgres_data:
